name: meson

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        buildtype:
          - plain
          - debug
          - debugoptimized
          - release
          - minsize
        cc:
          - clang-18
          - clang-19
          - clang-20
          - clang-21
          - clang-22
          - clang-23
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --batch --yes --dearmor \
                -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg]" \
            "https://apt.llvm.org/jammy/" \
            "llvm-toolchain-jammy-${CC#clang-} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
      - run: |
          sudo apt-get install -yqq --no-install-recommends \
            python3-venv pkgconf libcmocka-dev ${{ matrix.cc }}
      - run: python3 -m venv .venv && .venv/bin/pip install meson==1.4.0
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: meson setup build -Dbuildtype=${{ matrix.buildtype }} -Dtests=true
      - run: meson compile -Cbuild -v
      - run: meson test -Cbuild -v

  ubuntu-24:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        buildtype:
          - plain
          - debug
          - debugoptimized
          - release
          - minsize
        cc:
          - gcc-14
          - clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: |
          sudo apt-get install -yqq --no-install-recommends \
            python3-venv pkgconf libcmocka-dev ${{ matrix.cc }}
      - run: python3 -m venv .venv && .venv/bin/pip install meson==1.4.0
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: meson setup build -Dbuildtype=${{ matrix.buildtype }} -Dtests=true
      - run: meson compile -Cbuild -v
      - run: meson test -Cbuild -v

  debian-sid:
    runs-on: ubuntu-latest
    container:
      image: debian:sid
    strategy:
      fail-fast: false
      matrix:
        buildtype:
          - plain
          - debug
          - debugoptimized
          - release
          - minsize
        cc:
          - gcc
          - gcc-14
          - gcc-15
          - gcc-16
          - clang
          - clang-18
          - clang-19
          - clang-21
          - clang-22
          - clang-23
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          apt-get install -yqq --no-install-recommends \
            build-essential meson pkgconf libcmocka-dev ${{ matrix.cc }}
      - run: meson setup build -Dbuildtype=${{ matrix.buildtype }} -Dtests=true
      - run: meson compile -Cbuild -v
      - run: meson test -Cbuild -v

  alpine:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:edge
          - alpine:latest
        buildtype:
          - plain
          - debug
          - debugoptimized
          - release
          - minsize
        cc:
          - gcc
          - clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: apk --no-cache add build-base meson cmocka-dev ${{ matrix.cc }}
      - run: meson setup build -Dbuildtype=${{ matrix.buildtype }} -Dtests=true
      - run: meson compile -Cbuild -v
      - run: meson test -Cbuild -v

  valgrind:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: |
          sudo apt-get install -yqq --no-install-recommends \
            build-essential meson pkgconf valgrind libcmocka-dev
      - run: meson setup build -Dbuildtype=debug -Dtests=true  -Dvalgrind=true
      - run: meson compile -Cbuild -v
      - run: meson test -Cbuild -v

  analyzer:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: |
          sudo apt-get install -yqq --no-install-recommends \
            build-essential meson pkgconf libcmocka-dev
      - run: meson setup build -Dbuildtype=debug -Danalyzer=true -Dtests=true
      - run: meson compile -Cbuild -v
      - run: meson test -Cbuild -v

  sanitizers:
    runs-on: ubuntu-26.04
    env:
      ASAN_OPTIONS: allocator_may_return_null=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: |
          sudo apt-get install -yqq --no-install-recommends \
            build-essential meson pkgconf libcmocka-dev
      - run: |
          meson setup build -Dbuildtype=debug -Dtests=true \
            -Db_sanitize=address,undefined
      - run: meson compile -Cbuild -v
      - run: meson test -Cbuild -v

  examples:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: |
          sudo apt-get install -yqq --no-install-recommends \
            build-essential meson pkgconf libcmocka-dev
      - run: meson setup build -Dbuildtype=debug -Danalyzer=true -Dexamples=true
      - run: meson compile -Cbuild -v

  benchmarks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: |
          sudo apt-get install -yqq --no-install-recommends \
            build-essential meson pkgconf libcmocka-dev \
            libuv1-dev libev-dev libevent-dev
      - run: |
          meson setup build -Dbuildtype=debug -Danalyzer=true \
            -Dbenchmarks=true
      - run: meson compile -Cbuild -v

  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: |
          sudo apt-get install -yqq --no-install-recommends \
            build-essential meson pkgconf libcmocka-dev \
            gcovr git curl gnupg
      - run: meson setup build -Dbuildtype=debug -Dtests=true -Db_coverage=true
      - run: meson test -Cbuild -v
      - run: ninja -Cbuild -v coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pavelxdd/evio
